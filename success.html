<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Completato!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-lime-100 to-green-200 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-lg w-full text-center border border-lime-300">
        <svg class="w-24 h-24 text-lime-500 mx-auto mb-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
        </svg>
        <h1 class="text-4xl font-bold text-lime-700 mb-4">Grazie per il tuo ordine!</h1>
        <p class="text-lg text-stone-700 mb-6">Il tuo pagamento è stato completato con successo. Riceverai una conferma via email a breve.</p>
        <div id="alveoDigitalDelivery" class="hidden mb-6 rounded-2xl border-2 border-amber-300 bg-amber-50 p-5 text-left">
          <div class="text-xs font-bold uppercase tracking-widest text-amber-700">Alveo Digitale</div>
          <h2 class="mt-1 text-2xl font-bold text-stone-900">Il tuo PDF è pronto</h2>
          <p class="mt-2 text-stone-700">Apri o scarica <strong>10 Colazioni dell’Alveare – Edizione Premium</strong> nella lingua scelta sul sito.</p>
          <a id="alveoDigitalDownload" href="/downloads/10-colazioni-it.pdf" class="mt-4 inline-block w-full rounded-xl bg-emerald-700 px-5 py-3 text-center font-bold text-white hover:bg-emerald-800">Apri il PDF Premium</a>
          <p id="alveoDigitalLanguage" class="mt-2 text-center text-sm font-semibold text-stone-500"></p>
        </div>
        <a href="/shop" class="inline-block bg-lime-600 hover:bg-lime-700 text-white font-semibold px-6 py-3 rounded-xl shadow-md transition-all duration-200 button-press-effect">
            Torna al Negozio
        </a>
    </div>
  <script data-alveo-delivery="true">
  (function(){
    const params=new URLSearchParams(location.search);
    if(params.get('xpay')!=='ok'||params.get('digital')!=='alveo')return;
    const supported=['it','en','de','fr','es'];
    let lang='it';
    try{
      const saved=String(localStorage.getItem('fda-site-language')||'').toLowerCase();
      if(supported.includes(saved))lang=saved;
    }catch(_){}
    const names={it:'Italiano',en:'English',de:'Deutsch',fr:'Français',es:'Español'};
    const box=document.getElementById('alveoDigitalDelivery');
    const link=document.getElementById('alveoDigitalDownload');
    const note=document.getElementById('alveoDigitalLanguage');
    if(link)link.href='/downloads/10-colazioni-'+lang+'.pdf';
    if(note)note.textContent='Lingua: '+names[lang];
    if(box)box.classList.remove('hidden');
  })();
  </script>
</body>
</html>
