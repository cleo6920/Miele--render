*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#fff6e8;color:#352522}
a{color:inherit}.top{background:#641b30;color:#ffedcc;padding:13px 20px}.top-inner{max-width:1180px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center}.top a{font-weight:800;text-decoration:none}.gold{color:#f3ca70}.back{border:1px solid #e8ba68;border-radius:30px;padding:9px 16px;font-size:.85rem}.container{max-width:1180px;margin:auto;padding:34px 20px 80px}.eyebrow{color:#905624;text-transform:uppercase;letter-spacing:.13em;font-size:12px;font-weight:900}h1{font:700 clamp(2.1rem,5vw,3.7rem)/1.1 Georgia,serif;color:#692238;margin:12px 0}h2{font:700 clamp(1.5rem,3vw,2.4rem)/1.2 Georgia,serif;color:#692238}.intro{max-width:750px;color:#635147;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:18px;margin:30px 0}.gift-card{display:flex;flex-direction:column;border:1px solid #dbba8a;background:#fffaf3;border-radius:17px;overflow:hidden;box-shadow:0 8px 22px #4c231015;text-decoration:none;transition:transform .18s,box-shadow .18s}.gift-card:hover,.gift-card:focus-visible{transform:translateY(-3px);box-shadow:0 16px 28px #4c23102e}.gift-pic{aspect-ratio:5/4;width:100%;background:linear-gradient(145deg,#583022,#be8c51);display:flex;justify-content:center;align-items:center;color:#fff0cb;text-align:center;padding:15px;font-weight:800}.gift-pic img{width:100%;height:100%;object-fit:cover}.gift-card-body{padding:19px;display:flex;flex-direction:column;flex:1}.gift-card h3{font:700 1.43rem/1.2 Georgia,serif;color:#702639;margin:9px 0}.gift-card p{line-height:1.5;color:#59483f;flex:1}.gift-card small{font-weight:800;color:#88592d}.numbers{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:10px;color:#642033}.numbers strong{font-size:1.4rem}.numbers span{font-size:.84rem;font-weight:800}.reveal{border-top:1px solid #ecd7b9;color:#692238;padding-top:13px;margin-top:13px;font-weight:850}.empty{background:#fffaf3;border:1px solid #e0c7a0;border-radius:16px;padding:34px;margin-top:28px;line-height:1.6}.detail{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:26px}.detail-main{width:100%;border-radius:18px;background:#fff;max-height:650px;object-fit:contain}.detail-copy{line-height:1.7}.detail-copy h1{margin-top:5px}.info{background:#fff;border-radius:14px;border:1px solid #dfc39d;padding:20px}.product-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;margin-top:22px}.product{background:white;border:1px solid #e4cbab;border-radius:15px;overflow:hidden}.product img{height:200px;width:100%;object-fit:contain;background:#fff}.product div{padding:18px}.product h3{font:700 1.2rem Georgia,serif;color:#692238}.product p{line-height:1.6}.paused{display:inline-block;padding:12px 20px;border-radius:12px;background:#f0e4ce;color:#665a4c;font-weight:750}.model-placeholder{font-size:2.8rem}.subnav{margin-top:22px}.subnav a{color:#762339;font-weight:850}@media(max-width:720px){.detail{grid-template-columns:1fr}.top-inner{flex-wrap:wrap}.container{padding:25px 15px 65px}}

/* Confezioni: narrazione leggibile e acquisto sotto la presentazione, nel riquadro contenuto. */
.detail-copy .gift-story{max-width:600px;color:#493c35}
.detail-copy .gift-story p{font-size:clamp(15px,1.3vw,17px);line-height:1.8;margin:0 0 16px}
.detail-copy .gift-story p:first-child{font-weight:550}
.contents-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(225px,330px);align-items:end;gap:18px 30px}
.contents-list{margin:0;padding-left:23px;font-size:16px;line-height:1.9}
.gift-action{width:100%;max-width:340px;justify-self:end}
.gift-action a{transition:background .15s ease}
.gift-action a:hover{background:#165037!important}
.gift-action p{font-size:13px!important;line-height:1.5;margin:8px 0 0!important}
@media(max-width:710px){.contents-layout{grid-template-columns:1fr}.gift-action{justify-self:stretch;max-width:none}.detail-copy .gift-story p{font-size:16px}}

/* Scheda regalo compatta: immagine discreta, sintesi e prodotti visibili subito. */
.container{padding-top:18px}
.subnav{margin-top:2px}
.detail{grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:20px;align-items:start;margin-top:14px;margin-bottom:10px}
.detail>div:first-child{display:flex;justify-content:center;align-items:flex-start}
.detail-main{display:block;width:100%;max-width:220px;max-height:290px;height:auto;object-fit:contain;border-radius:12px}
.detail-copy{line-height:1.5}
.detail-copy h1{font-size:clamp(2rem,3.6vw,3.15rem);line-height:1.08;margin:5px 0 9px}
.detail-copy .gift-story p{font-size:16px;line-height:1.55;font-weight:400;margin:0 0 8px}
.detail-copy .gift-story p:first-child{font-weight:400}
.detail-copy .numbers{margin:10px 0 0}
.info{padding:14px 18px}
.info h2{font-size:clamp(1.35rem,2.1vw,1.8rem);margin:0 0 9px}
.contents-layout{align-items:center;gap:10px 20px}
.contents-list{font-size:14px;line-height:1.6}
.gift-action>div{margin:3px 0 7px!important}
.gift-action a{padding:11px 14px!important;font-size:14px}
.gift-action p{font-size:12px!important}
.container>section:nth-of-type(2) h2{font-size:clamp(1.5rem,2.3vw,2rem);margin:17px 0 10px}
.product-grid{gap:14px;margin-top:10px}
.product img{height:145px}
.product div{padding:12px 15px}
.product h3{font-size:1.15rem;margin:5px 0 8px}
.product p{font-size:13px;margin:5px 0;line-height:1.45}
@media(max-width:720px){
 .detail{grid-template-columns:minmax(0,1fr);gap:13px;margin-top:12px}
 .detail-main{max-width:185px;max-height:250px}
 .detail-copy h1{font-size:clamp(2rem,8vw,2.6rem)}
 .detail-copy .gift-story p{font-size:15px}
 .contents-layout{grid-template-columns:1fr}
 .gift-action{max-width:none}
 .product-grid{grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}
 .product img{height:120px}
}

/* Contenuto portato sotto prezzo e Punti Ape, a fianco della fotografia principale. */
.detail-contents{margin:12px 0 0;padding:12px 15px;border-radius:13px}
.detail-contents h2{font:700 clamp(1.2rem,2vw,1.6rem)/1.2 Georgia,serif;margin:0 0 8px;color:#692238}
.detail-contents .contents-layout{grid-template-columns:minmax(0,1fr) minmax(210px,320px);gap:10px 22px;align-items:center}
.detail-contents .contents-list{margin:0;padding-left:20px;font-size:13.5px;line-height:1.6}
.detail-contents .gift-action{max-width:320px;width:100%;justify-self:end}
.detail-contents .gift-action p{font-size:11.5px!important;line-height:1.45;margin:7px 0 0!important}
.product-gallery h2{font-size:clamp(1.5rem,2.3vw,2rem);margin:14px 0 9px}
@media(max-width:720px){.detail-contents .contents-layout{grid-template-columns:1fr}.detail-contents .gift-action{justify-self:stretch;max-width:none}.detail-contents{margin-top:10px}}

/* Contiene a sinistra; riquadro d'ordine autonomo nella zona destra indicata. */
.purchase-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,320px);gap:14px;align-items:stretch;margin-top:14px}
.purchase-layout .detail-contents{margin:0;padding:12px 15px;min-width:0}
.purchase-layout .detail-contents h2{font:700 clamp(1.2rem,2vw,1.6rem)/1.2 Georgia,serif;margin:0 0 10px}
.purchase-layout .contents-list{font-size:13.5px;line-height:1.7;margin:0;padding-left:19px}
.purchase-panel{align-self:stretch;background:#fffaf2;border:1px solid #dfc39d;border-radius:13px;padding:14px;display:flex;flex-direction:column;justify-content:center;gap:9px;min-width:0}
.purchase-panel .gift-buy-btn{display:block;border-radius:12px;text-align:center;background:#246749;color:#fff;padding:13px 10px;font-weight:850;font-size:14px;text-decoration:none;transition:background .18s ease}
.purchase-panel .gift-buy-btn:hover,.purchase-panel .gift-buy-btn:focus-visible{background:#165037}
.purchase-panel p{color:#665447;margin:0!important;font-size:12px;line-height:1.5}
@media(max-width:940px){.purchase-layout{grid-template-columns:1fr}.purchase-panel{padding:12px}}

/* Struttura distinta e a tutta larghezza: "Contiene" a sinistra, ordine a destra. */
.detail-bottom-grid{display:grid!important;grid-template-columns:minmax(0,440px) minmax(0,355px)!important;justify-content:space-between;align-items:center;column-gap:45px;row-gap:15px;margin:4px 0 15px;width:100%}
.detail-bottom-grid .detail-contents{width:100%;margin:0!important;min-height:132px;border:1px solid #dfc39d!important;background:#fff!important;border-radius:14px;padding:14px 19px!important}
.detail-bottom-grid .detail-contents h2{margin:0 0 12px;font:700 1.6rem Georgia,serif;color:#692238}
.detail-bottom-grid .detail-contents ul{font-size:14px;line-height:1.65;margin:0;padding-left:21px}
.detail-bottom-grid .purchase-panel{width:100%;max-width:355px;justify-self:end;align-self:center;background:#fff9ec!important;border:1px solid #cfa76b!important;box-shadow:0 8px 25px rgba(90,40,25,.1);border-radius:15px;padding:15px 19px!important;min-height:130px}
.detail-bottom-grid .purchase-panel-heading{font:800 11px/1.4 system-ui,sans-serif;letter-spacing:.11em;color:#8a552b;text-align:center;margin-bottom:10px}
.detail-bottom-grid .gift-buy-btn{font-size:15px;padding:14px 12px;display:block}
.detail-bottom-grid .purchase-panel p{font-size:12px;line-height:1.35;margin:10px 0 0!important;text-align:center}
@media(max-width:760px){.detail-bottom-grid{grid-template-columns:1fr!important;gap:13px;margin:11px 0 18px}.detail-bottom-grid .purchase-panel{max-width:none;justify-self:stretch}.detail-bottom-grid .detail-contents{min-height:auto}.detail-bottom-grid .purchase-panel{min-height:auto}}

/* Contiene torna sotto descrizione e prezzo; acquisto indipendente sulla destra. */
.hero-bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,300px);gap:16px;align-items:stretch;margin:13px 0 0}
.hero-bottom .detail-contents{max-width:none;min-width:0;margin:0!important;border:1px solid #e0c39e;background:#fff;padding:15px 18px;border-radius:14px}
.hero-bottom .detail-contents h2{margin:0 0 11px;color:#692238;font:700 1.55rem Georgia,serif}
.hero-bottom .detail-contents ul{font-size:13.5px;line-height:1.7;padding-left:20px;margin:0}
.hero-bottom .purchase-panel{margin:0!important;max-width:300px;min-height:0;background:#fff9e9;border:1px solid #cb9b57;padding:15px;box-shadow:0 5px 18px rgba(50,30,10,.08);border-radius:14px;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:10px}
.hero-bottom .purchase-panel-heading{text-align:center;font-size:11px;letter-spacing:.1em;color:#88521e;font-weight:850}
.hero-bottom .purchase-panel .gift-buy-btn{display:block;padding:13px 14px;font-size:16px;font-weight:850;border-radius:12px;text-align:center;text-decoration:none;background:#246749;color:white}
.hero-bottom .purchase-panel .gift-buy-btn:hover{background:#165037}
.hero-bottom .purchase-panel p{font-size:12px!important;line-height:1.45;text-align:center;margin:0!important}
@media(max-width:900px){.hero-bottom{grid-template-columns:1fr}.hero-bottom .purchase-panel{max-width:none}}

/* Nuova posizione richiesta: acquisto DENTRO "Contiene", sulla destra dell'elenco. */
.hero-bottom[data-layout="acquista-dentro-contiene"]{
  display:block!important;width:min(100%,610px)!important;max-width:610px!important;margin:12px 0 0!important;
}
.hero-bottom[data-layout="acquista-dentro-contiene"] .detail-contents{
  width:100%;max-width:none!important;margin:0!important;padding:13px 15px!important;
  border:1px solid #e0c39e;background:#fff!important;border-radius:14px;
}
.hero-bottom .contents-inside{display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,230px);align-items:center;gap:12px}
.hero-bottom .contents-copy{min-width:0}
.hero-bottom .contents-copy h2{font:700 1.5rem Georgia,serif;color:#692238;margin:0 0 9px}
.hero-bottom .contents-copy .contents-list{font-size:13px;line-height:1.6;padding-left:18px;margin:0}
.hero-bottom .contents-inside .purchase-panel{
  max-width:230px!important;min-width:0!important;width:100%!important;margin:0!important;padding:12px 10px!important;
  background:#fff8eb!important;border:1px solid #d7b581!important;border-radius:12px;
  box-shadow:none!important;display:flex;flex-direction:column;gap:7px;justify-content:center;
}
.hero-bottom .contents-inside .purchase-panel-heading{font-size:10px;letter-spacing:.08em;margin:0}
.hero-bottom .contents-inside .gift-buy-btn{padding:11px 8px!important;font-size:15px!important}
.hero-bottom .contents-inside .purchase-panel p{font-size:11px!important;line-height:1.35!important;text-align:center;margin:0!important}
@media(max-width:690px){
  .hero-bottom[data-layout="acquista-dentro-contiene"]{width:100%!important}
  .hero-bottom .contents-inside{grid-template-columns:1fr;gap:12px}
  .hero-bottom .contents-inside .purchase-panel{max-width:none!important}
}

/* Layout compatto definitivo: Contiene sale sotto la descrizione; prezzo SOPRA Acquista,
   pulsante più a sinistra e fotografie delle tre specialità anticipate. */
.detail{grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:18px;margin-top:10px;margin-bottom:3px;align-items:start}
.detail-main{max-width:180px;max-height:244px}
.detail-copy h1{margin-top:3px;margin-bottom:7px}
.detail-copy .gift-story p{font-size:15px;line-height:1.42;margin-bottom:0}
.hero-bottom[data-layout="acquista-dentro-contiene"]{width:min(100%,535px)!important;max-width:535px!important;margin:5px 0 0!important}
.hero-bottom[data-layout="acquista-dentro-contiene"] .detail-contents{padding:10px 11px!important}
.hero-bottom .contents-inside{grid-template-columns:minmax(0,1fr) 205px!important;gap:8px;align-items:center}
.hero-bottom .contents-copy h2{font-size:1.35rem;margin:0 0 6px}
.hero-bottom .contents-copy .contents-list{font-size:12px;line-height:1.5}
.hero-bottom .contents-inside .purchase-panel{max-width:205px!important;padding:9px 10px!important;gap:5px}
.hero-bottom .gift-purchase-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.hero-bottom .gift-purchase-price{font:800 19px/1.2 system-ui,sans-serif;color:#6a2037}
.hero-bottom .gift-purchase-points{font:800 10px/1.3 system-ui,sans-serif;color:#6a2037}
.hero-bottom .contents-inside .gift-buy-btn{padding:9px 8px!important;font-size:14px!important}
.hero-bottom .contents-inside .purchase-panel p{font-size:10px!important}
.product-gallery h2{margin:8px 0 7px!important}
.product-grid{margin-top:6px!important}
@media(max-width:690px){
 .detail{grid-template-columns:1fr;gap:9px}
 .detail-main{max-width:155px;max-height:210px}
 .hero-bottom[data-layout="acquista-dentro-contiene"]{width:100%!important}
 .hero-bottom .contents-inside{grid-template-columns:1fr!important;gap:8px}
 .hero-bottom .contents-inside .purchase-panel{max-width:none!important}
}

/* Il cliente vede che le fotografie illustrano il contenuto del regalo, non altri acquisti. */
.product-gallery .gallery-intro{max-width:950px;margin:8px 0 12px}
.product-gallery .gallery-intro h2{font:700 clamp(1.55rem,2.6vw,2.15rem)/1.2 Georgia,serif;color:#692238;margin:0 0 7px!important}
.product-gallery .gallery-intro p{font-size:14px;line-height:1.5;margin:0;color:#564536}
.product-gallery .gallery-intro p strong{color:#602536}
.product-gallery .product-grid{margin-top:10px!important}


/* Boutique Regalo Forte: i titoli sono protagonisti, le descrizioni diventano citazioni. */
.grid{gap:20px;align-items:stretch}
.grid .gift-card{background:#fffaf1!important;border:1px solid #d5ae70;border-radius:19px;box-shadow:0 3px 0 #c6a3702d,0 12px 28px #5e24351c;transition:transform .22s,box-shadow .22s,border-color .22s}
.grid .gift-card:hover{transform:translateY(-5px);border-color:#b57e33;box-shadow:0 4px 0 #b9814133,0 22px 36px #5a203336}
.grid .gift-card:focus-visible{outline:3px solid #d4a147;outline-offset:3px}
.grid .gift-pic{position:relative;aspect-ratio:5/4;padding:0;border-bottom:3px solid #cba159;background:radial-gradient(circle at 32% 25%,#bd875b,#815042 60%,#57253c)}
.grid .gift-pic img{object-position:center;transition:transform .4s}
.grid .gift-card:hover .gift-pic img{transform:scale(1.035)}
.grid .gift-pic .model-placeholder{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:61px;filter:drop-shadow(0 6px 9px #35201770)}
.grid .gift-pic:before{content:"✧";position:absolute;top:13px;right:15px;color:#ffe3a4;font:400 26px/1 Georgia,serif;z-index:2}
.grid .gift-card-body{padding:18px 18px 19px;background:radial-gradient(circle at 100% 10%,#eecb9430,transparent 55%),linear-gradient(155deg,#fffdf8,#fff3e3);position:relative}
.grid .gift-card-body:before{content:"";position:absolute;top:0;left:18px;width:48px;height:3px;background:linear-gradient(90deg,#ab7734,#ebd08a)}
.grid .gift-card small.gift-kind{align-self:flex-start;display:inline-flex;align-items:center;padding:6px 11px;border-radius:5px 18px 18px 5px;background:linear-gradient(105deg,#f0d9ad,#fff3d8);border:1px solid #d9b878;color:#754c20;font:900 10px/1.15 system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase}
.grid .gift-card small.gift-kind:before{content:"✦";font:700 10px Georgia,serif;margin-right:7px;color:#9a6429}
.grid .gift-card h3{color:#662036!important;font:700 clamp(23px,2.2vw,29px)/1.08 Georgia,"Times New Roman",serif!important;letter-spacing:-.025em;margin:15px 0 12px!important;min-height:2.15em;text-shadow:0 1px 0 #fff}
.grid .gift-card h3:after{content:"◆ ─────────";display:block;color:#c6a058;overflow:hidden;white-space:nowrap;font:400 11px/1 Georgia,serif;letter-spacing:0;margin-top:10px;width:105px}
.grid .gift-card p.gift-teaser{position:relative;font:italic 16px/1.43 Georgia,"Times New Roman",serif!important;color:#74513e!important;padding-left:23px;margin:0 0 19px!important;min-height:4.3em;flex:1}
.grid .gift-card p.gift-teaser:before{content:"“";position:absolute;top:-11px;left:0;color:#cc9c52;font:700 42px/1 Georgia,serif}
.grid .gift-card-pricing{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:14px 0 11px;margin:0 0 10px;border-top:1px solid #ddc18f}
.grid .gift-card-pricing strong{color:#652137!important;font:900 clamp(23px,2.4vw,30px)/1.1 system-ui,sans-serif!important;white-space:nowrap;letter-spacing:-.045em}
.grid .gift-bee-points{display:inline-flex;align-items:center;padding:7px 10px;border:1px solid #dec184;border-radius:100px;background:linear-gradient(180deg,#fff3ce,#f4dfac);color:#7c4d12!important;font:850 11px/1.15 system-ui,sans-serif!important;white-space:nowrap}
.grid .gift-card .reveal{border:1px solid #9f7246!important;border-radius:11px;margin-top:auto;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(180deg,#84334a,#5a1c32);color:#fff8e9!important;box-shadow:inset 0 1px #fff5de4d,0 6px 14px #5d1a322e;font:800 13px/1.25 system-ui,sans-serif!important}
.grid .gift-card .gift-reveal-arrow{display:flex;align-items:center;justify-content:center;width:23px;height:23px;border:1px solid #f2d19d65;border-radius:50%;color:#f4d38d;font:800 17px/1 sans-serif;transition:transform .2s}
.grid .gift-card:hover .reveal{background:linear-gradient(180deg,#73283f,#48172b)}
.grid .gift-card:hover .gift-reveal-arrow{transform:translateX(3px)}
@media(max-width:610px){
 .grid{grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
 .grid .gift-card-body{padding:14px 12px}
 .grid .gift-card-body:before{left:12px}
 .grid .gift-card h3{font-size:21px!important}
 .grid .gift-card p.gift-teaser{font-size:14px!important;min-height:4em}
 .grid .gift-card-pricing strong{font-size:22px!important}
 .grid .gift-bee-points{font-size:10px!important}
 .grid .gift-card .reveal{font-size:11px!important;padding:11px}
}
@media(prefers-reduced-motion:reduce){.grid .gift-card,.grid .gift-pic img,.grid .gift-card .gift-reveal-arrow{transition:none!important}}

/* Prodotti alveoterapia nella propria linea, non nella home dello shop. */
.alveo-line-products{margin-top:23px}
.alveo-line-heading h2{margin:0 0 8px;color:#68243b;font:700 clamp(25px,3.4vw,35px)/1.16 Georgia,serif}
.alveo-line-heading>p{margin:0;color:#685046;font-size:15px;line-height:1.55}
.alveo-products-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:19px;margin-top:24px;align-items:stretch}
