name: Sync index from Vercel repository

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Render repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: cleo6920/miele-backend
          ref: main
          path: _source

      - name: Copy exact index.html
        run: cp _source/index.html ./index.html

      - name: Verify source and copied file are identical
        run: cmp --silent _source/index.html ./index.html

      - name: Commit copied index
        run: |
          rm -rf _source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html already synchronized"
          else
            git commit -m "[sync-old] Copy exact index.html from miele-backend"
            git push
          fi
