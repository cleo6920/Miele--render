# Trigger Cloudflare production build after dashboard branch/build settings were saved.
name: Cloudflare Test Build

on:
  push:
    branches:
      - cloudflare-test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cloudflare-test
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Cloudflare static assets
        env:
          CLOUDFLARE_BUILD: '1'
        run: npm run build:cloudflare

      - name: Create optimized WebP from the correct uploaded Christmas image
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source=Path("images/Regali dal mondo delle api_ Natale in festa.png")
          output=Path("dist/images/regali-natale-nuovo-20261021.webp")
          if not source.exists():
              raise RuntimeError("Correct Christmas image not found")
          with Image.open(source) as picture:
              original_size=picture.size
              picture=picture.convert("RGB")
              picture.thumbnail((1920, 1400), Image.Resampling.LANCZOS)
              picture.save(output, format="WEBP", quality=86, method=6)
          print("Correct original image:", original_size, "bytes:", source.stat().st_size)
          print("New optimized image:", Image.open(output).size, "bytes:", output.stat().st_size)
          if output.stat().st_size < 30000:
              raise RuntimeError("Unexpectedly small optimized banner")
          PY

      - name: Save optimized correct banner in repository for both Cloudflare deployment paths
        run: |
          if [ ! -s images/regali-natale-nuovo-20261021.webp ]; then
            cp dist/images/regali-natale-nuovo-20261021.webp images/regali-natale-nuovo-20261021.webp
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add images/regali-natale-nuovo-20261021.webp
            git commit -m "Keep optimized current Christmas banner in static site assets"
            git push origin HEAD:cloudflare-test
          else
            echo "Permanent correct banner already present."
          fi

      - name: Optimize new Alimenti e Bevande Christmas photo
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          source=Path("images/Cesta natalizia italiana gourmet con fiocco dorato.png")
          output=Path("dist/images/linea-alimenti-natale-regali.webp")
          if not source.is_file():
              raise RuntimeError("Uploaded Alimenti e Bevande image is missing")
          with Image.open(source) as img:
              img=img.convert("RGB")
              img.thumbnail((1000, 1000),Image.Resampling.LANCZOS)
              img.save(output,format="WEBP",quality=82,method=6)
          if output.stat().st_size < 20000:
              raise RuntimeError("The converted gift image looks incomplete")
          print("Category photo optimized:",output.name, output.stat().st_size,"bytes")
          PY

      - name: Preserve optimized category photo in GitHub images
        run: |
          if [ ! -s images/linea-alimenti-natale-regali.webp ]; then
            cp dist/images/linea-alimenti-natale-regali.webp images/linea-alimenti-natale-regali.webp
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add images/linea-alimenti-natale-regali.webp
            git commit -m "Optimize Alimenti e Bevande Christmas category photo"
            git push origin HEAD:cloudflare-test
          else
            echo "Optimized category photo already preserved."
          fi

      - name: Verify essential output
        run: |
          test -f dist/index.html
          # Three Alveoterapia products must be listed only under Linea 01.
          test -f dist/confezioni-linea.html
          grep -q 'function renderAlveoterapiaProducts' dist/confezioni-linea.html
          grep -q 'Capsule PROPOLIT (5 pz)' dist/confezioni-linea.html
          grep -q 'handleAlveoterapiaCategoryLink' dist/shop-v2.html
          ! grep -q '<section class="catalog-world" id="alveoterapia-prodotti"' dist/shop-v2.html
          test -f dist/shop/index.html
          test -f dist/home.html
          test -d dist/images
          test -s dist/images/linea-alimenti-natale-regali.webp
          test -f cloudflare-worker.js
          grep -q '"regalo-sapori-del-bosco": 6' dist/shop-v2.html
          grep -q 'acquistaRegalo' dist/shop-v2.html
          grep -q "'regalo-sapori-del-bosco':2000" cloudflare-worker.js
          test -f wrangler.jsonc
          test "$(grep -o 'class="gift-line-card"' dist/shop-v2.html | wc -l)" -eq 8
          ! grep -q 'Sinfonia di Frutta' dist/shop-v2.html
          grep -q 'regali-natale-nuovo-20261021.webp' dist/shop-v2.html
          test -s dist/images/regali-natale-nuovo-20261021.webp
          echo "Cloudflare test build PASS: 8 gift sections, no stale cards, correct new Christmas banner"

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Verify actual live site after deployment
        if: success()
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          sleep 6
          for host in lafabbricadelleapi.it la-fabbrica-delle-api-test.althea12830.workers.dev; do
            echo "::group::Live content at $host"
            url="https://$host/shop-v2.html?check=$COMMIT_SHA"
            if curl --fail --silent --show-error --location --retry 2 --max-time 30 -H 'Cache-Control: no-cache' "$url" -o /tmp/shop-response.html; then
              echo "bytes=$(wc -c < /tmp/shop-response.html)"
              echo "gift_line_cards=$((grep -o 'class="gift-line-card"' /tmp/shop-response.html || true) | wc -l)"
              echo "old_gift_cards=$((grep -o 'Sinfonia di Frutta' /tmp/shop-response.html || true) | wc -l)"
              echo "fast_christmas_image=$((grep -o 'regali-natale-nuovo-20261021.webp' /tmp/shop-response.html || true) | wc -l)"
              curl --fail --silent --show-error --location --retry 2 --max-time 30 "https://$host/images/regali-natale-nuovo-20261021.webp?check=$COMMIT_SHA" -o /tmp/banner-verified.webp
              [ "$(file -b --mime-type /tmp/banner-verified.webp)" = "image/webp" ] || { echo "::error::Correct banner image is not a WebP"; exit 1; }
              [ "$(wc -c < /tmp/banner-verified.webp)" -ge 30000 ] || { echo "::error::Correct banner image too small"; exit 1; }
              if [ "$host" = "lafabbricadelleapi.it" ]; then
                [ "$((grep -o 'class="gift-line-card"' /tmp/shop-response.html || true) | wc -l)" -eq 8 ] || { echo "::error::Live domain is not showing 8 cards"; exit 1; }
                ! grep -q 'Sinfonia di Frutta' /tmp/shop-response.html || { echo "::error::Live domain still shows old cards"; exit 1; }
              fi
            else
              echo "::error::Cannot check public domain $host"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Verify Alveoterapia products are in Linea 01, not shop homepage
        if: success()
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e
          for host in lafabbricadelleapi.it la-fabbrica-delle-api-test.althea12830.workers.dev; do
            curl --fail --silent --show-error --location --max-time 30 -H 'Cache-Control: no-cache' "https://$host/shop-v2.html?alveo_move=$COMMIT_SHA" -o /tmp/alveo-shop.html
            ! grep -q '<section class="catalog-world" id="alveoterapia-prodotti"' /tmp/alveo-shop.html || { echo 'Old Alveoterapia listing still on shop home'; exit 1; }
            grep -q 'handleAlveoterapiaCategoryLink' /tmp/alveo-shop.html || { echo 'Product cart link handler not live'; exit 1; }
            curl --fail --silent --show-error --location --max-time 30 -H 'Cache-Control: no-cache' "https://$host/confezioni-linea.html?linea=alveoterapia&check=$COMMIT_SHA" -o /tmp/alveo-line.html
            grep -q 'function renderAlveoterapiaProducts' /tmp/alveo-line.html || { echo 'Alveoterapia line content missing'; exit 1; }
            grep -q 'Capsule PROPOLIT (5 pz)' /tmp/alveo-line.html || { echo 'Capsule products missing'; exit 1; }
            grep -q 'propolterapy-professional' /tmp/alveo-line.html || { echo 'Diffuser product missing'; exit 1; }
            echo "$host: all three products in Linea 01 and removed from homepage."
          done
      - name: Verify gift detail page structure on public domain
        if: success()
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e
          for host in lafabbricadelleapi.it la-fabbrica-delle-api-test.althea12830.workers.dev; do
            curl --fail --silent --show-error --location --max-time 30 -H "Cache-Control: no-cache" "https://$host/confezioni-linea.html?linea=alimenti-bevande&regalo=REG-001&check=$COMMIT_SHA" -o /tmp/gift-live.html
            grep -q 'data-layout="acquista-dentro-contiene"' /tmp/gift-live.html || { echo "::error::Gift contents and checkout not in right place at $host"; exit 1; }
            grep -q 'acquistaRegalo=REG-001' /tmp/gift-live.html || { echo "::error::Shop checkout CTA missing at $host"; exit 1; }
            ! grep -q 'wa.me/393348476020' /tmp/gift-live.html || { echo "::error::Old WhatsApp CTA still present at $host"; exit 1; }
            grep -q "<h2>Contiene</h2>" /tmp/gift-live.html || { echo "::error::Contents label missing at $host"; exit 1; }
            echo "$host: Contiene with embedded Acquista in right-hand space, Nexi shop link enabled."
          done

      - name: Verify B01 Dolce Incontro live
        if: success()
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for host in lafabbricadelleapi.it la-fabbrica-delle-api-test.althea12830.workers.dev; do
            curl --fail --silent --show-error --location --max-time 30 -H 'Cache-Control: no-cache' "https://$host/confezioni-linea.html?linea=alimenti-bevande&regalo=B01&v=$COMMIT_SHA" -o /tmp/b01-live.html
            grep -Fq 'confezione-b01-dolce-incontro.png' /tmp/b01-live.html
            grep -Fq "acquistaRegalo='+encodeURIComponent(m.id)" /tmp/b01-live.html
            grep -Fq 'Il cuore di Dolce Incontro' /tmp/b01-live.html
            grep -Fq '"id":"B01"' /tmp/b01-live.html
            grep -Fq '"points":3' /tmp/b01-live.html
            curl --fail --silent --show-error --location --max-time 30 "https://$host/images/confezione-b01-dolce-incontro.png?v=$COMMIT_SHA" -o /tmp/b01-live.png
            [ "$(file -b --mime-type /tmp/b01-live.png)" = "image/png" ]
            [ "$(wc -c < /tmp/b01-live.png)" -gt 100000 ]
            curl --fail --silent --show-error --location --max-time 30 "https://$host/shop-v2.html?test=$COMMIT_SHA" -o /tmp/b01-shop.html
            grep -Fq 'regalo-b01-dolce-incontro' /tmp/b01-shop.html
            echo "$host: B01 visible with photo, two-product gallery and cart integration."
          done
          curl --fail --silent --show-error --location --retry 1 --max-time 30 'https://gcdn.picsart.com/editing-temp/23444fe3-04b6-4f26-8d7d-a7738bdc17ce.jpeg' -o /tmp/b01-millefiori-photo
          [ "$(file -b --mime-type /tmp/b01-millefiori-photo)" = "image/jpeg" ]
          [ "$(wc -c < /tmp/b01-millefiori-photo)" -gt 5000 ]

      - name: Verify B02 and B03 gift cards on public site
        if: success()
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for host in lafabbricadelleapi.it la-fabbrica-delle-api-test.althea12830.workers.dev; do
            curl --fail --silent --show-error --location --max-time 30 -H 'Cache-Control: no-cache' "https://$host/confezioni-linea.html?linea=alimenti-bevande&regalo=B02&v=$COMMIT_SHA" -o /tmp/b02-live.html
            grep -Fq 'confezione-b02-pausa-doro.png' /tmp/b02-live.html
            grep -Fq 'confezione-b03-abbraccio-dautunno.png' /tmp/b02-live.html
            grep -Fq 'Il piacere di una pausa speciale' /tmp/b02-live.html
            grep -Fq 'Due sapori che raccontano' /tmp/b02-live.html
            grep -Fq "\"id\":\"B02\"" /tmp/b02-live.html
            grep -Fq "\"id\":\"B03\"" /tmp/b02-live.html
            grep -Fq "acquistaRegalo='+encodeURIComponent(m.id)" /tmp/b02-live.html
            for file in confezione-b02-pausa-doro.png confezione-b03-abbraccio-dautunno.png; do
              curl --fail --silent --show-error --location --max-time 30 "https://$host/images/$file?v=$COMMIT_SHA" -o /tmp/b02-b03-live.png
              [ "$(file -b --mime-type /tmp/b02-b03-live.png)" = "image/png" ]
              [ "$(wc -c < /tmp/b02-b03-live.png)" -gt 500000 ]
            done
            curl --fail --silent --show-error --location --max-time 30 "https://$host/shop-v2.html?v=$COMMIT_SHA" -o /tmp/b02-b03-shop.html
            grep -Fq 'regalo-b02-pausa-doro' /tmp/b02-b03-shop.html
            grep -Fq 'regalo-b03-abbraccio-dautunno' /tmp/b02-b03-shop.html
            echo "$host: B02 & B03 image, two-product galleries, 13.90 checkout and cart links visible."
          done
