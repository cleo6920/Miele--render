name: Inventory image paths

on:
  push:
    paths:
      - '.github/workflows/inventory-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract image references
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8', errors='ignore')
          refs = sorted(set(re.findall(r'(?:(?:src|image|img|url)\s*[:=]\s*["\']?|["\'])(/?images/[A-Za-z0-9._%() +@-]+\.(?:png|jpe?g|webp|gif))', text, flags=re.I)))
          # Fallback: capture every literal images/... occurrence.
          refs += re.findall(r'/?images/[A-Za-z0-9._%() +@-]+\.(?:png|jpe?g|webp|gif)', text, flags=re.I)
          refs = sorted(set(x.lstrip('/') for x in refs))
          Path('IMAGE_REFERENCES.txt').write_text('\n'.join(refs) + ('\n' if refs else ''), encoding='utf-8')
          print(f'Found {len(refs)} image references')
          for x in refs:
              print(x)
          PY
      - name: Commit manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IMAGE_REFERENCES.txt
          if git diff --cached --quiet; then
            echo "No manifest changes"
          else
            git commit -m "Inventory image references [skip ci]"
            git push
          fi
