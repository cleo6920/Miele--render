name: Build Alimenti premium images

on:
  push:
    branches: [fix-alimenti-two-premium-images]
    paths:
      - '.github/workflows/build-alimenti-premium-images.yml'

permissions:
  contents: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original Apinfiore product photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp images
          curl -L --fail --retry 4 --retry-delay 2 'https://www.apinfiore.com/app/uploads/2023/03/Miele-di-Acacia-e-Zenzero_web-12.jpg' -o .tmp/acacia-zenzero.jpg
          curl -L --fail --retry 4 --retry-delay 2 'https://www.apinfiore.com/app/uploads/2023/03/Miele-Italiano-di-Eucalipto_web-14.jpg' -o .tmp/eucalipto.jpg
      - name: Make large sharp local images and obscure supplier brand
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageChops, ImageFilter, ImageEnhance
          from pathlib import Path

          jobs = [
              ('.tmp/acacia-zenzero.jpg', 'images/acacia-zenzero-premium.jpg'),
              ('.tmp/eucalipto.jpg', 'images/eucalipto-premium.jpg'),
          ]

          def trim_white(im):
              rgb = im.convert('RGB')
              bg = Image.new('RGB', rgb.size, (255,255,255))
              diff = ImageChops.difference(rgb, bg).convert('L')
              diff = diff.point(lambda p: 255 if p > 18 else 0)
              box = diff.getbbox()
              if not box:
                  return rgb
              x0,y0,x1,y1 = box
              pad = int(max(x1-x0, y1-y0) * 0.04)
              return rgb.crop((max(0,x0-pad), max(0,y0-pad), min(rgb.width,x1+pad), min(rgb.height,y1+pad)))

          for src, dst in jobs:
              im = trim_white(Image.open(src))
              im.thumbnail((820,820), Image.Resampling.LANCZOS)
              canvas = Image.new('RGB', (900,900), 'white')
              x = (900-im.width)//2
              y = (900-im.height)//2
              canvas.paste(im, (x,y))

              # The supplier logo is in the upper-centre of the front label.
              # Blur only that band, keeping the product name and jar readable.
              bx0, by0, bx1, by1 = int(900*.30), int(900*.35), int(900*.70), int(900*.47)
              logo = canvas.crop((bx0,by0,bx1,by1)).filter(ImageFilter.GaussianBlur(radius=16))
              canvas.paste(logo, (bx0,by0))

              # Improve card readability without changing the product itself.
              canvas = ImageEnhance.Sharpness(canvas).enhance(1.35)
              canvas = ImageEnhance.Contrast(canvas).enhance(1.04)
              canvas.save(dst, 'JPEG', quality=92, optimize=True, progressive=True)
          PY
      - name: Commit generated product images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add images/acacia-zenzero-premium.jpg images/eucalipto-premium.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Add large local Alimenti product images [skip ci]'
          git push
