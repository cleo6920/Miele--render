name: Build Alveo PDF preview images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-alveo-preview-images.yml'

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download the three approved preview pages
        env:
          PAGE2_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/9f610a43-3b56-466c-90a2-37f4b619376b.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYWU5ZTU4YjgxMTNhYTkzNiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTkxMDU4NH0.Px6yKit49ywcvPu7O_OdG6qkRhoxpqhVWB1KEQAGYU8"
          PAGE3_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/0c7c766a-36f8-4796-a9cc-c360b0f98403.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOWMxNzYwMzYxOTNmY2IxMiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTg1NjA1NH0.aUhP1aM7tL0r78_Lm6xfjFMqPk5pZ5TLdC2Awx-n0I8"
          PAGE4_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/3678759b-00af-4255-8d9d-3081f4078d74.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZmFjN2ZiMTMwNTdiMzgzZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTg1MTUzOX0.sZoHmvIa7hiqVzHpncD-3J0qD16Ur3MOBBvki2VcD_0"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$PAGE2_URL" -o /tmp/presentazione.png
          curl --fail --location --retry 3 "$PAGE3_URL" -o /tmp/ricetta.png
          curl --fail --location --retry 3 "$PAGE4_URL" -o /tmp/extra.png

      - name: Create fast high-quality WebP previews
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = [
              (Path('/tmp/presentazione.png'), Path('images/alveo-preview-presentazione.webp')),
              (Path('/tmp/ricetta.png'), Path('images/alveo-preview-ricetta.webp')),
              (Path('/tmp/extra.png'), Path('images/alveo-preview-extra.webp')),
          ]

          for src, target in files:
              img = Image.open(src).convert('RGB')
              if img.size != (1323, 1871):
                  raise SystemExit(f'Unexpected source dimensions for {src}: {img.size}')
              h = round(img.height * 900 / img.width)
              img = img.resize((900, h), Image.Resampling.LANCZOS)
              img.save(target, 'WEBP', quality=82, method=6)
              check = Image.open(target)
              size = target.stat().st_size
              if check.size != (900, 1273):
                  raise SystemExit(f'Unexpected output dimensions for {target}: {check.size}')
              if not (40000 <= size <= 160000):
                  raise SystemExit(f'Unexpected output size for {target}: {size}')
              print(target, check.size, size, 'bytes')

      - name: Commit preview assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/alveo-preview-presentazione.webp images/alveo-preview-ricetta.webp images/alveo-preview-extra.webp
          git commit -m "Render: aggiunge anteprima Alveo nitida e leggera"
          git push origin main
