name: Export Alveo Translations
on:
  push:
    branches: [alveo-premium-work]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: alveo-translations
          path: translations/10-colazioni-*.json
          if-no-files-found: error
