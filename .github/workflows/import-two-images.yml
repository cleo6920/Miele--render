name: Import recovered original images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-two-images.yml'

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download recovered original images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          download() { name="$1"; id="$2"; echo "Downloading $name"; curl -L --fail --retry 3 --retry-delay 2 -o "images/$name" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"; test -s "images/$name"; }
