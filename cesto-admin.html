<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordini Cesto</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111827;color:#f9fafb;font-family:Arial,sans-serif;padding:18px}.wrap{max-width:1100px;margin:auto}.card{background:#1f2937;border:1px solid #374151;border-radius:18px;padding:18px;margin-bottom:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1,h2{color:#fbbf24;margin-top:0}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:900;cursor:pointer}.primary{background:#f59e0b;color:#111827}.secondary{background:#374151;color:white}input,select{padding:11px;border-radius:10px;border:2px solid #4b5563;background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;border-radius:14px;background:#111827}.stat strong{display:block;font-size:1.5rem;color:#fbbf24}.order{border-left:6px solid #f59e0b}.order.done{border-left-color:#22c55e}.rows{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.products{line-height:1.6}.money{font-weight:900;color:#86efac}.msg{padding:12px;border-radius:10px;background:#111827}.err{color:#fca5a5}.ok{color:#86efac}.statusline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.small{color:#d1d5db;font-size:.9rem}.order-num{font:900 1.15rem monospace;color:#fbbf24}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.rows{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:stretch}.top>*{width:100%}}</style></head>
<body><div class="wrap">
<div class="card"><h1>📦 ORDINI CESTO DELL’ALVEARE</h1><p>Area amministrativa per preparare e seguire i Cesti riscattati con 100 Api.</p><div id="login"><input id="adminKey" type="password" placeholder="Codice amministratore" autocomplete="current-password"><button class="btn primary" id="loginBtn">ACCEDI AGLI ORDINI</button><div id="loginMsg" class="msg">Inserisci il codice amministratore.</div></div><div id="toolbar" hidden class="top"><div><select id="filter"><option value="TUTTI">Tutti gli ordini</option><option>DA PREPARARE</option><option>PREPARATO</option><option>SPEDITO</option><option>CONSEGNATO</option></select> <button class="btn secondary" id="refresh">AGGIORNA</button></div><button class="btn secondary" id="logout">ESCI</button></div></div>
<div class="grid" id="stats" hidden><div class="stat"><strong id="nPrepare">0</strong>Da preparare</div><div class="stat"><strong id="nReady">0</strong>Preparati</div><div class="stat"><strong id="nShipped">0</strong>Spediti</div><div class="stat"><strong id="nDone">0</strong>Consegnati</div></div>
<div id="orders"></div>
</div><script src="/cesto-admin.js"></script></body></html>
